[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtgprinter"
version = "1.0.0"
authors = [{ name="Stefan Horst", email="stefan-horst@gmx.de" }]
description = "A tool for printing Magic cards on a thermal printer using a Raspberry Pi."
dependencies = [
    "requests",
    "pillow",
    "rpi.gpio",
    "luma.oled",
    "pytest",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
