[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtgprinter"
version = "1.0.0"
authors = [{ name="Stefan Horst", email="stefan-horst@gmx.de" }]
description = "A tool for printing Magic cards on a thermal printer using a Raspberry Pi."
dependencies = [
    "requests",
    "aiohttp[speedups]",
    "aiofiles",
    "pillow",
]

[project.optional-dependencies]
raspi = [
    "rpi.gpio",
    "luma.oled",
    "python.escpos[serial]",
]
